apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: transcoder-scaler
  namespace: default
spec:
  scaleTargetRef:
    name: transcoder-worker
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 10
  cooldownPeriod: 120
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379  
        listName: bull:video-transcode:wait
        listLength: "3"
# Keep local transcoding bounded: uploads queue quickly, FFmpeg work scales slowly.
